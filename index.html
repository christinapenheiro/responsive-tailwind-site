<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Font Awesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
        integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />

    <!-- Tailwind CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>nature's platter</title>
</head>

<body>
    <header class="bg-[#EFEBE3]">
        <nav class="flex justify-between container mx-auto pt-4">
            <img src="./assets/nav-logo.png" alt="" class="w-25">
            <ul class="flex gap-4 items-center">
                <li class="cursor-pointer">Product</li>
                <li class="cursor-pointer">Services</li>
                <li class="cursor-pointer">Contact us</li>
            </ul>
            <div class="flex items-center justify-center gap-4">
                <span class="cursor-pointer"><i class="fa-solid fa-magnifying-glass"></i></span>
                <span class="cursor-pointer"><i class="fa-solid fa-cart-shopping"></i></span>
                <button class="rounded border border-[#179800] font-semibold px-3 py-1 cursor-pointer">Login</button>
                <button class="rounded bg-[#179800] font-semibold text-white px-3 py-1 cursor-pointer">Register</button>
            </div>
        </nav>
    </header>
    <main>
        <section id="hero" class="bg-[#EFEBE3]">
            <div class="text-center pt-11 container mx-auto">
            <div class="max-w-[40%] mx-auto">
            <h2 class="text-4xl font-bold pb-3">Freshness <span class="text-[#179800]">You Can Count</span> On, Prices You'll Love!</h2>
            <p>Shop your daily essentials at unbeatable prices. From fresh produce to pantry staples, we've got you
                covered every day!</p>
                </div>
            <img src="./assets/Hero Section 1.png" alt="" class="max-w-[60%] mx-auto">
            </div>
        </section>
        <section id="services">
        </section>
    </main>

</body>

</html>
